[package]
name = "winui-remote-desktop"
version = "0.1.0"
description = "WinUI Remote Desktop - Tauri + Fluent UI React v9 + RustDesk"
edition = "2021"

# 保持仅一个二进制 crate，便于 Linux 跨平台构建；
# Windows 打包为 dll/msi 时可再拆分为 lib + bin 结构。
[[bin]]
name = "winui-remote-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
# LAN 远程控制协议：帧内 base64、JPEG 编码、动态加载 IDD 控制 DLL
base64 = "0.22"
jpeg-encoder = "0.6"
libloading = "0.8"

# ----------------------------------------------------------------------
# RustDesk 生态复用说明：
# 以下 git 依赖在 Linux 上编译极慢且易失败，当前阶段（POC）不实际引入。
# 阶段一目标为工程骨架 + 跨平台可编译，待 Windows 打包时再启用：
#
# hbb_common = { git = "https://github.com/rustdesk/rustdesk", subdirectory = "libs/hbb_common" }
# scrap      = { git = "https://github.com/rustdesk/rustdesk", subdirectory = "libs/scrap" }
#
# 更稳妥的做法是将其作为 git submodule 引入（参考 README 第 2.1 节）。
# ----------------------------------------------------------------------

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_Security",
] }

[profile.dev]
# debuginfo=1（仅行号表）：规避 rustc 1.97 对 webview2-com 等巨型类型
# 生成完整调试信息时的 ICE（debuginfo=2 崩溃）
debug = 1

[profile.dev.package."*"]
# 依赖不生成调试信息，显著加快编译并规避 LLVM debuginfo 崩溃
debug = 0

[profile.release]
strip = true
lto = true
