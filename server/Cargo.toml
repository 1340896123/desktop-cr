[package]
name = "dcr-server"
version = "0.1.0"
edition = "2021"
description = "dcr 远程桌面信号服务器/中继服务器(脚手架 + 协议基础库)"

[lib]
name = "dcr_server"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
# Web 管理后台:HTTP 服务 / 静态文件托管
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
# 账号认证:argon2 密码哈希 + JWT 令牌
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"

[dev-dependencies]
# 管理 API 集成测试用 Router::oneshot
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "dcr-signal"
path = "src/bin/dcr-signal.rs"

[[bin]]
name = "dcr-relay"
path = "src/bin/dcr-relay.rs"
